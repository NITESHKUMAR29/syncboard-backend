# Render Blueprint. Importing the repo with this file present fills in the build and
# start commands, the health check and the environment variables, so the only manual
# step is pasting the two secrets.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: taskflow-backend
    runtime: node
    plan: free
    # Put the server in the same region as the database. A single API request makes
    # several queries, so a cross-country round trip on each one is felt immediately.
    # This matches a Neon project in us-east-2. If Render rejects the name, use `oregon`.
    region: ohio

    # Migrations run as part of the build rather than as a pre-deploy step, which the
    # free tier does not offer. Doing it here still means a failed migration fails the
    # deploy instead of crash-looping a running service, and it keeps migrations out of
    # the start command: a free instance sleeps and restarts often, and paying for a
    # migration check on every wake would slow an already slow cold start.
    # --include=dev is required, not decorative: NODE_ENV=production below tells npm to
    # skip devDependencies, but the build needs them — TypeScript, the type packages and
    # the Prisma CLI all live there. Without it the compile fails on a missing @types/ws.
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start

    # Render restarts the service if this stops returning 200.
    healthCheckPath: /api/v1/health

    envVars:
      # Pin the runtime. Without this the platform picks its own default, which can
      # differ from the version the lockfile was resolved against and changes under you
      # over time. Prisma 7 requires ^20.19, ^22.12 or >=24.
      - key: NODE_VERSION
        value: '22.20.0'

      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Paste your Neon DIRECT (unpooled) connection string, ending in ?sslmode=require.
      # Marked sync:false so Render prompts for it instead of storing it in this file.
      - key: DATABASE_URL
        sync: false

      # Generated once by Render and kept. Changing it signs everyone out.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_ISSUER
        value: taskflow
      - key: JWT_AUDIENCE
        value: taskflow-android
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: '15'
      - key: REFRESH_TOKEN_TTL_DAYS
        value: '30'

      # PUBLIC_BASE_URL is deliberately not set here. `fromService` exposes the internal
      # address (host:port), which produces file URLs no client outside the platform can
      # open. The app falls back to RENDER_EXTERNAL_URL, which is the public https:// one.

      # Empty means uploads go to local disk, which a free instance wipes on redeploy.
      # Set these to a Cloudflare R2 or S3 bucket if attachments must survive.
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false

      # Empty means push payloads are written to the log instead of sent.
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
